[project]
name = "Quantitative_fairness"
version = "0.1.0"
description = "Replication analyses for Quantitative Relaxations for Arrow's Axioms"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.2.1",
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "joblib>=1.5.1",
    "joblib-progress>=1.0.6",
    "matplotlib>=3.10.5",
    "numpy>=2.2.6",
    "openpyxl>=3.1.5",
    "pandas>=2.3.1",
    "pyarrow>=23.0.1",
    "pytest>=8.4.1",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
    "sortedcontainers>=2.4.0",
    "tqdm>=4.67.1",
    "votekit>=3.3.0",
]

[project.optional-dependencies]
geography = ["geopandas==1.1.4"]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "isort>=7.0.0",
    "ruff>=0.15.0",
    "ty>=0.0.15",
]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]

[tool.ruff]
line-length = 100
extend-exclude = ["code/archive", "code/preprocessing"]

[tool.ruff.lint]
extend-select = ["D212"]

[tool.ty.environment]
extra-paths = ["code"]

[tool.ty.src]
exclude = ["code/archive", "code/preprocessing"]
